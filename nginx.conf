# 靜態檔案伺服器（容器內）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # 首頁直接導到手冊
    location = / { return 302 /travel-handbook/; }
    location = /travel-handbook { return 301 /travel-handbook/; }

    location /travel-handbook/ {
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /travel-handbook/404.html;
    }

    # 打包過的 js/css 檔名含雜湊，可以長期快取
    location /travel-handbook/_nuxt/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
