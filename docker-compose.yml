# travel-handbook 前端（Nuxt 4 產生的純靜態網站，沒有後端）
# 本機看：http://localhost:8090/travel-handbook/
# 對外網址改用 GitHub Pages：https://wworldflower.github.io/travel-handbook-frontend/（push 到 main 自動更新）
# 更新內容（改 app/data/trip.json 或程式）：.\deploy_frontend.cmd
name: travel-handbook-frontend

# log 輪替：每個檔最多 10MB，保留 3 個
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: .
      args:
        NUXT_APP_BASE_URL: /travel-handbook/
    restart: unless-stopped
    ports:
      # 只有這台電腦連得到
      - "127.0.0.1:8090:80"
    logging: *logging
    networks:
      web:
        aliases:
          - travel-handbook-frontend

networks:
  web:
    external: true
